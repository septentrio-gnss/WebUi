[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
    links2004/WebSockets@^2.4.1
    ArduinoJson
    Preferences
    ESPAsyncWebServer

build_src_filter =
    +<**/*.cpp>
    -<led_test.cpp>
    
build_flags =
    -DWEBUI_HAS_KTD2026=1 ; Hardware capabilities of this ESP32 target (KTD drivers are present on the board)


[env:led_test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_src_filter =
    +<led_test.cpp>
    -<main.cpp>
    -<AppGlobals.cpp>
    -<config/*.cpp>
    -<led/*.cpp>
    -<web/*.cpp>
    -<websocket/*.cpp>
    -<gnss/*.cpp>
    -<ntrip/*.cpp>
    -<ble/*.cpp>
    -<logging/*.cpp>

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = arduino

; Heemol ESP32-S3-WROOM-1 N16R8
; 16 MB QSPI Flash + 8 MB OPI PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

; Filesystem and partition table
board_build.filesystem = spiffs
board_build.partitions = huge_app.csv

; Compile the WebUI application and exclude the standalone LED test
build_src_filter =
    +<**/*.cpp>
    -<led_test.cpp>

; Native USB CDC console
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBUI_HAS_KTD2026=0 ; This development board has no external KTD2026 LED drivers

upload_protocol = esptool
upload_port = COM23
monitor_port = COM23
upload_speed = 115200
monitor_speed = 115200

monitor_filters =
    esp32_exception_decoder

lib_deps =
    links2004/WebSockets@^2.7.3
    bblanchon/ArduinoJson@^7.4.3
    ESP32Async/ESPAsyncWebServer@^3.11.2